name: CI

# Lint, typecheck, tests unitarios y build en cada PR (spec 12).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck y build
        run: npm run build

      - name: Tests unitarios
        run: npm test
