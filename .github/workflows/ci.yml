name: CI

# Typecheck, tests unitarios y build en cada PR. (El lint todavía tiene errores
# preexistentes; se agrega cuando quede en verde, ver specs/12-infra-scripts.md.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck y build
        run: npm run build

      - name: Tests unitarios
        run: npm test
